version: '3.8'
services:
  position-api:
    build: .
    container_name: position-api
    ports:
      - "5001:5001"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # No PUPPETEER_EXECUTABLE_PATH: puppeteer uses the Chrome build it
      # installs itself, which is guaranteed to match the puppeteer version.
    # If you need to persist data, add volumes here
    # volumes:
    #   - .:/app
    #   - /app/node_modules
    # If your app needs to access host network (rarely needed)
    # network_mode: host
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
